name: ExamSkeeda AI Engine Code Check
on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "package.json"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
