
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExamSkeeda AI Content Studio</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fc;color:#17233c;margin:0;padding:16px}
main{max-width:650px;margin:auto}
header{background:#173d80;color:white;padding:22px;border-radius:16px}
h1{margin:0 0 8px;font-size:25px}
.card{background:white;padding:18px;margin-top:16px;border-radius:14px;box-shadow:0 3px 12px #0001}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #ccd4e0;border-radius:8px;font-size:16px}
button{background:#1763d1;color:white;border:0;padding:13px;border-radius:8px;font-size:16px;font-weight:bold;margin-top:16px;width:100%}
button.secondary{background:#46536a}
small,.muted{color:#5e6b80}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit}
.hidden{display:none}
</style>
</head>
<body>
<main>
<header>
<h1>ExamSkeeda AI</h1>
<p>Original learning materials for CBSE Classes 6–12</p>
</header>

<section class="card">
<h2>Admin sign-in</h2>
<label>Admin token</label>
<input id="token" type="password" autocomplete="current-password" placeholder="Enter your private admin token">
<p class="muted">Use the token configured on your backend host.</p>
<button onclick="loadDrafts()">Connect to AI Studio</button>
<div id="status" role="status"></div>
</section>

<section class="card">
<h2>Generate a draft</h2>
<form id="generator">
<label>Class</label>
<select name="classLevel">
<option value="6">Class 6</option><option value="7">Class 7</option>
<option value="8">Class 8</option><option value="9">Class 9</option>
<option value="10">Class 10</option><option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<label>Subject</label>
<input name="subject" required placeholder="e.g. Mathematics">

<label>Chapter</label>
<input name="chapter" required placeholder="Chapter name or topic">

<label>Language</label>
<select name="language">
<option>English</option><option>Hindi</option><option>Odia</option>
</select>

<label>Content type</label>
<select name="contentType">
<option value="notes">Chapter notes</option>
<option value="mcq_set">MCQ questions</option>
<option value="short_answers">Short questions and answers</option>
<option value="long_answers">Long questions and answers</option>
<option value="worksheet">Worksheet</option>
<option value="revision_test">Revision test</option>
</select>

<label>Difficulty</label>
<select name="difficulty">
<option>mixed</option><option>easy</option><option>moderate</option><option>hard</option>
</select>

<label>Extra instructions (optional)</label>
<textarea name="instructions" rows="3" placeholder="Mention syllabus or special requirements"></textarea>

<button type="submit">Generate draft</button>
</form>
<div id="result" role="status"></div>
</section>

<section class="card">
<h2>Saved drafts</h2>
<button class="secondary" onclick="loadDrafts()">Refresh drafts</button>
<div id="drafts"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
function headers(){
 return {"Content-Type":"application/json","x-admin-token":$("token").value.trim()};
}
async function api(url,options={}){
 const response=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});
 const data=await response.json().catch(()=>({}));
 if(!response.ok) throw Error(data.error||"Request failed");
 return data;
}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function loadDrafts(){
 $("status").textContent="Connecting...";
 try{
  const drafts=await api("/api/drafts");
  $("status").textContent="Connected. "+drafts.length+" saved drafts.";
  $("drafts").innerHTML=drafts.map(d=>`
   <article class="card">
    <h3>${escapeHTML(d.title)}</h3>
    <p>${escapeHTML("Class "+d.classLevel+" · "+d.subject+" · "+d.chapter)}</p>
    <p>Status: <strong>${escapeHTML(d.status)}</strong></p>
    <pre>${escapeHTML(d.content)}</pre>
    ${d.quality?.issues?.length?`<p>Review: ${escapeHTML(d.quality.issues.join(" "))}</p>`:""}
    ${d.status==="pending_review"?`
     <button onclick="reviewDraft('${d.id}','approve')">Approve</button>
     <button class="secondary" onclick="reviewDraft('${d.id}','reject')">Reject</button>`:""}
   </article>`).join("")||"<p>No drafts yet.</p>";
 }catch(e){$("status").textContent="Connection failed: "+e.message;}
}
async function reviewDraft(id,action){
 try{
  await api("/api/drafts/"+id+"/"+action,{method:"POST",body:JSON.stringify({})});
  await loadDrafts();
 }catch(e){alert(e.message);}
}
$("generator").addEventListener("submit",async event=>{
 event.preventDefault();
 $("result").textContent="Generating your draft. Please wait...";
 const input=Object.fromEntries(new FormData(event.target).entries());
 input.classLevel=Number(input.classLevel);
 try{
  const draft=await api("/api/generate",{method:"POST",body:JSON.stringify(input)});
  $("result").textContent="Draft created. Please review it before using or publishing.";
  await loadDrafts();
 }catch(e){$("result").textContent="Error: "+e.message;}
});
</script>
</body>
</html>
